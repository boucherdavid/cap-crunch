name: Mise à jour stats saison régulière

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Déclenchement manuel depuis l'onglet Actions sur GitHub
  workflow_dispatch:
    inputs:
      date:
        description: 'Date à traiter (YYYY-MM-DD). Vide = hier ET.'
        required: false
        default: ''

  # Trois passages par nuit (2026-10-05) : GitHub retardait le seul passage de 6h UTC jusqu'à
  # ~12h UTC (8h ET), après que les poolers aient consulté le classement. Minutes décalées (moins
  # retardées qu'une heure pile) ; l'upsert est idempotent, chaque passage complète le précédent.
  # Jamais avant 4h UTC : « hier ET » (get_yesterday_et) désignerait alors l'avant-veille.
  schedule:
    - cron: '23 5 * * *'
    - cron: '23 7 * * *'
    - cron: '23 9 * * *'

jobs:
  update-regular-stats:
    name: Import game-logs saison régulière
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python_script/requirements.txt

      - name: Installer les dépendances
        run: pip install -r python_script/requirements.txt

      - name: Mettre à jour les stats saison régulière
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python python_script/import_regular_stats.py --date "${{ github.event.inputs.date }}"
          else
            python python_script/import_regular_stats.py
          fi

      # Staging aussi (2026-10-04) : sans ça, le classement de staging n'avait que les matchs importés
      # à la main et ne correspondait pas à la prod. Un échec ici ne doit pas faire échouer la prod.
      - name: Mettre à jour les stats saison régulière (staging)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.STAGING_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python python_script/import_regular_stats.py --date "${{ github.event.inputs.date }}"
          else
            python python_script/import_regular_stats.py
          fi
