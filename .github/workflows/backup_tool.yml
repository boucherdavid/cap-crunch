name: Backup manuel du pool

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Déclenchement manuel depuis l'onglet Actions sur GitHub
  workflow_dispatch:

  # Schedule automatique : tous les dimanches à 12h00 UTC
  schedule:
    - cron: '0 12 * * 0'

jobs:
  backup:
    name: Régénère backup/pool_backup.html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python_script/requirements.txt

      - name: Installer les dépendances
        run: pip install -r python_script/requirements.txt

      - name: Générer l'outil de backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python python_script/generate_backup_tool.py

      - name: Committer si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup/pool_backup.html
          git diff --cached --quiet && echo "Aucun changement." || git commit -m "chore(backup): régénère pool_backup.html"
          git push
