name: Stats avancées (MoneyPuck)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

  # Tous les jours à 11h UTC (7h ET) — MoneyPuck met ses CSV à jour après les matchs de la veille.
  schedule:
    - cron: '0 11 * * *'

jobs:
  import:
    name: Importe les stats avancées MoneyPuck dans player_advanced_stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python_script/requirements.txt

      - name: Installer les dépendances
        run: pip install -r python_script/requirements.txt

      - name: Importer les stats avancées
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python python_script/import_advanced_stats.py
